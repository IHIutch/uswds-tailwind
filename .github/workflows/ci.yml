name: CI

# Runs directly on PRs and is called by release.yml before versioning or publishing.
on:
  workflow_call:
  pull_request:
    branches:
      - main
      - next

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Build packages
        run: pnpm build:packages

      - name: Build documentation site
        run: pnpm build:website

      - name: Publish PR previews
        if: github.event_name == 'pull_request'
        run: pnpm dlx pkg-pr-new publish ./packages/**/*

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Run ESLint
        run: pnpm lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Build packages
        run: pnpm build:packages

      - name: Run TypeScript check
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Build packages
        run: pnpm build:packages

      # needrestart on the Ubuntu 24.04 runner prompts during `apt-get install`,
      # which hangs the headless `--with-deps` step. Disable it before installing.
      - name: Disable needrestart prompts
        run: echo "\$nrconf{restart} = 'a';" | sudo tee /etc/needrestart/conf.d/99-ci.conf

      - name: Setup Playwright
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: pnpm exec playwright install --with-deps chromium

      - name: Run tests
        run: pnpm test
