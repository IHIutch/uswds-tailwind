name: Release

on:
  push:
    branches:
      - next

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js and pnpm (no postinstall scripts)
        uses: ./.github/actions/setup-pnpm
        with:
          ignore-scripts: 'true'

      - name: Setup npm for trusted publishing and dist-tags
        run: npm install --global npm@11.21.0

      # When changesets are present on the branch, opens/updates a
      # "chore(release): version packages" PR. When that PR merges (no
      # remaining changesets), builds and publishes to npm.
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset:version
          publish-script: pnpm changeset:publish
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          NPM_TOKEN: '' # https://github.com/changesets/changesets/issues/1152#issuecomment-3190884868
