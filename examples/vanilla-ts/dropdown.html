<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link
    rel="icon"
    type="image/svg+xml"
    href="/vite.svg"
  />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Vite + TS</title>
  <link
    href="./../src/styles.css"
    rel="stylesheet"
  >
</head>

<body class="font-source-sans p-4">
  <div class="space-y-8">

    <div
      data-scope="dropdown"
      data-part="root"
      class="relative inline-block"
    >
      <button
        data-part="trigger"
        type="button"
        class="group flex cursor-pointer items-center gap-2 rounded-sm bg-blue-60v px-5 py-3 font-bold leading-none text-white hover:bg-blue-warm-70v active:bg-blue-warm-80v focus:outline-4 focus:outline-offset-4 focus:outline-blue-40v"
      >
        Languages
        <span
          aria-hidden="true"
          class="icon-[material-symbols--expand-more] size-5 transition-transform group-data-[state=open]:rotate-180"
        ></span>
      </button>

      <ul
        data-part="content"
        class="absolute right-0 z-30 mt-2 w-60 divide-y divide-gray-cool-10 bg-blue-warm-80v outline-hidden not-[[data-state=open]]:hidden"
      >
        <li data-part="item" data-value="ar">
          <a
            href="#ar"
            class="block p-2 text-white hover:underline focus:outline-4 focus:-outline-offset-4 focus:outline-blue-40v"
            lang="ar"
          >
            <strong>العربية</strong> (Arabic)
          </a>
        </li>
      </ul>
    </div>

    <div
      data-scope="dropdown"
      data-part="root"
      class="relative inline-block"
    >
      <button
        data-part="trigger"
        type="button"
        class="group flex cursor-pointer items-center gap-2 rounded-sm bg-blue-60v px-5 py-3 font-bold leading-none text-white hover:bg-blue-warm-70v active:bg-blue-warm-80v focus:outline-4 focus:outline-offset-4 focus:outline-blue-40v"
      >
        Languages
        <span
          aria-hidden="true"
          class="icon-[material-symbols--expand-more] size-5 transition-transform group-data-[state=open]:rotate-180"
        ></span>
      </button>

      <ul
        data-part="content"
        class="absolute right-0 z-30 mt-2 w-60 divide-y divide-gray-cool-10 bg-blue-warm-80v outline-hidden not-[[data-state=open]]:hidden"
      >
        <li data-part="item" data-value="ar">
          <a
            href="#ar"
            class="block p-2 text-white hover:underline focus:outline-4 focus:-outline-offset-4 focus:outline-blue-40v"
            lang="ar"
          >
            <strong>العربية</strong> (Arabic)
          </a>
        </li>
      </ul>
    </div>
  </div>

  <script
    type="module"
    src="./../src/index.ts"
  ></script>
</body>

</html>
